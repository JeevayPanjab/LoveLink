<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoveLink">
<meta name="theme-color" content="#0B0714">
<title>Create your account — LoveLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/main.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <blockquote>
      "I stopped swiping and started actually talking to people within a week."
      <cite>— A LoveLink member</cite>
    </blockquote>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <a href="../index.html" class="logo">LoveLink</a>
      <h1>Create your account</h1>
      <p>Free to join. Takes about two minutes.</p>

      <div class="form-message" id="signupMessage"></div>

      <!-- Email/password signup -->
      <form id="signupForm">
        <div class="form-message"></div>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Jasleen Kaur" autocomplete="name" required>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <div class="divider">or continue with</div>

      <div class="social-row">
        <button class="social-btn" id="googleBtn" type="button">🔵 Google</button>
        <a href="signup-phone.html" class="social-btn">📱 Phone number</a>
      </div>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../scripts/supabase-client.js"></script>
<script src="../scripts/auth.js"></script>
<script>
  requireGuest();
  document.getElementById('signupForm').addEventListener('submit', handleSignup);
  document.getElementById('googleBtn').addEventListener('click', handleGoogleLogin);
  // Route the inline form-message div to the handler
  document.getElementById('signupForm').querySelector('.form-message');
</script>
</body>
</html>
