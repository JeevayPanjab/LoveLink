<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — LoveLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/main.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <blockquote>
      "Forgot my password once, had a reset link in under a minute."
      <cite>— A LoveLink member</cite>
    </blockquote>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <a href="../index.html" class="logo">LoveLink</a>
      <h1>Forgot your password?</h1>
      <p>Enter your email and we'll send a reset link.</p>

      <form id="forgotForm">
        <div class="form-message"></div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../scripts/supabase-client.js"></script>
<script src="../scripts/auth.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', handleForgotPassword);
</script>
</body>
</html>
