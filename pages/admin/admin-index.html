<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoveLink">
<meta name="theme-color" content="#0B0714">
<title>Admin — LoveLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles/main.css">
<link rel="stylesheet" href="../../styles/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="../../index.html" class="logo">LoveLink <span style="font-size:11px; color:var(--text-faint); font-family:var(--font-body);">admin</span></a>
    <nav>
      <a href="index.html" class="active"><span class="ic">📊</span> Overview</a>
    </nav>
    <div class="sidebar-footer">
      <img class="avatar" id="sidebarAvatar" alt="">
      <div class="who"><strong id="sidebarName">Loading…</strong><span>Admin</span></div>
      <button id="logoutBtn" title="Log out">⎋</button>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div><h1>Admin overview</h1><p>Platform health, users, reports and payments.</p></div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total users</div><div class="value" id="statTotal">—</div></div>
      <div class="stat-card"><div class="label">Premium users</div><div class="value" id="statPremium">—</div></div>
      <div class="stat-card"><div class="label">New signups (7d)</div><div class="value" id="statSignups">—</div></div>
      <div class="stat-card"><div class="label">Open reports</div><div class="value" id="statReports">—</div></div>
    </div>

    <div class="admin-tabs">
      <button class="active" data-tab="users">Users</button>
      <button data-tab="reports">Reports</button>
      <button data-tab="payments">Payments</button>
    </div>

    <div id="tabUsers">
      <div style="margin-bottom:16px;">
        <input type="text" id="userSearch" placeholder="Search by name or username…" style="padding:10px 16px; border-radius:999px; border:1px solid var(--glass-border); background:var(--glass); color:var(--text-primary); width:280px;">
      </div>
      <table class="data-table">
        <thead><tr><th></th><th>Name</th><th>Gender</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

    <div id="tabReports" style="display:none;">
      <table class="data-table">
        <thead><tr><th>Type</th><th>Reported user</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="reportsBody"></tbody>
      </table>
    </div>

    <div id="tabPayments" style="display:none;">
      <table class="data-table">
        <thead><tr><th>User</th><th>Plan</th><th>Cycle</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="paymentsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../scripts/supabase-client.js"></script>
<script src="../../scripts/app-shell.js"></script>
<script src="../../scripts/admin.js"></script>
</body>
</html>
