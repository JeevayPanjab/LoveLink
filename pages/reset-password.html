<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoveLink">
<meta name="theme-color" content="#0B0714">
<title>Set a new password — LoveLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/main.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <blockquote>
      "Almost there — one more step and you're back in."
      <cite>— LoveLink</cite>
    </blockquote>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form">
      <a href="../index.html" class="logo">LoveLink</a>
      <h1>Set a new password</h1>
      <p>Choose something you haven't used before.</p>

      <form id="resetForm">
        <div class="form-message"></div>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" autocomplete="new-password" required>
          <div class="field-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../scripts/supabase-client.js"></script>
<script src="../scripts/auth.js"></script>
<script>
  // Supabase places the recovery session in the URL hash automatically;
  // supabase-js reads it on load, so no extra parsing needed here.
  document.getElementById('resetForm').addEventListener('submit', handleResetPassword);
</script>
</body>
</html>
