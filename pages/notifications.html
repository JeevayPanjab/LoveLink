<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoveLink">
<meta name="theme-color" content="#0B0714">
<title>Notifications — LoveLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/main.css">
<link rel="stylesheet" href="../styles/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="../index.html" class="logo">LoveLink</a>
    <nav>
      <a href="dashboard.html"><span class="ic">🏠</span> Home</a>
      <a href="discover.html"><span class="ic">🔍</span> Discover</a>
      <a href="matches.html"><span class="ic">💜</span> Matches</a>
      <a href="messages.html"><span class="ic">💬</span> Messages</a>
      <a href="notifications.html" class="active"><span class="ic">🔔</span> Notifications</a>
      <a href="profile-setup.html"><span class="ic">👤</span> My Profile</a>
      <a href="premium.html"><span class="ic">✨</span> Go Premium</a>
      <a href="admin/index.html" id="adminNavLink" class="hidden"><span class="ic">🛡️</span> Admin</a>
      <a href="settings.html"><span class="ic">⚙️</span> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <img class="avatar" id="sidebarAvatar" alt="">
      <div class="who"><strong id="sidebarName">Loading…</strong><span id="sidebarPlan">Free</span></div>
      <button id="logoutBtn" title="Log out">⎋</button>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div><h1>Notifications</h1><p>Likes, matches and messages, all in one place.</p></div>
    </div>
    <div id="notifList" style="display:flex; flex-direction:column; gap:2px;"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../scripts/supabase-client.js"></script>
<script src="../scripts/app-shell.js"></script>
<script>
(async function () {
  const shell = await initAppShell();
  if (!shell) return;

  const { data: notifs } = await supabaseClient
    .from('notifications')
    .select('*')
    .eq('user_id', shell.session.user.id)
    .order('created_at', { ascending: false })
    .limit(50);

  const list = document.getElementById('notifList');
  if (!notifs || notifs.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted); font-size:14px;">Nothing yet — activity on your profile will show up here.</p>';
    return;
  }

  const icons = { like: '💜', match: '✨', message: '💬', super_like: '⭐' };
  list.innerHTML = notifs.map(n => `
    <div style="display:flex; gap:14px; align-items:center; padding:14px 16px; border-radius:14px; background:${n.is_read ? 'transparent' : 'var(--glass)'};">
      <span style="font-size:20px;">${icons[n.type] || '🔔'}</span>
      <div style="flex:1;">
        <div style="font-size:14px;">${n.message}</div>
        <div style="font-size:12px; color:var(--text-faint); margin-top:2px;">${new Date(n.created_at).toLocaleString()}</div>
      </div>
    </div>
  `).join('');

  await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', shell.session.user.id).eq('is_read', false);
})();
</script>
</body>
</html>
